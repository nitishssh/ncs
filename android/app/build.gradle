plugins {
    id "com.android.application"
}

android {
    namespace "com.studioutility.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.studioutility.app"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"  // pairing QR scanner
}
