plugins {
    id "com.android.application"
}

android {
    namespace "com.studioutility.app"
    compileSdk 34
    defaultConfig {
        applicationId "com.studioutility.app"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "0.4.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // one Kotlin stdlib version: androidx brings 1.8, older libs bring the split jdk7/jdk8 jars
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.webkit:webkit:1.11.0"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"  // pairing QR scanner
}
