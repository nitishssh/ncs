[project]
name = "studio-utility"
version = "0.1.0"
description = "Custom cross-platform control software for Canon EOS R50 V (Wi-Fi, USB, Bluetooth, video)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "bleak>=0.22",
  "opencv-python>=4.9",
  "PySide6>=6.7",
  "sounddevice>=0.4",  # external mics (DJI Mic, Kreo Sonik) on the computer
  "soundfile>=0.12",
  "pedalboard>=0.9",   # voice chain: low-cut, gate, EQ, compressor, limiter, VST3 plugins
  "noisereduce>=3.0",  # Audacity-style noise-profile reduction for saved recordings
  "imageio-ffmpeg>=0.5",  # bundled ffmpeg for voice-into-clip sync when none is installed
  "scipy>=1.10",
  "aiohttp>=3.9",   # studio-utility hub: one camera shared by phone, Mac and Windows
  "zeroconf>=0.130", # Bonjour discovery of the hub
  "qrcode>=7",       # pairing QR codes
]

[project.optional-dependencies]
framegen = ["rife-ncnn-vulkan-python", "pillow"]
gphoto = ["gphoto2>=2.5"]   # macOS/Linux USB fallback

[project.scripts]
studio-utility = "studio_utility.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# sounddevice sets ndarray.shape internally (deprecated in NumPy 2.5); not our code
filterwarnings = ["ignore::DeprecationWarning:sounddevice"]

[tool.setuptools.packages.find]
include = ["studio_utility*"]
