[project]
name = "camctl"
version = "0.1.0"
description = "Custom cross-platform control software for Canon EOS R50 V (Wi-Fi, USB, Bluetooth, video)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "bleak>=0.22",
  "opencv-python>=4.9",
  "PySide6>=6.7",
]

[project.optional-dependencies]
framegen = ["rife-ncnn-vulkan-python", "pillow"]
gphoto = ["gphoto2>=2.5"]   # macOS/Linux USB fallback

[project.scripts]
camctl = "camctl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
