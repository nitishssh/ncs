[project]
name = "camctl"
version = "0.1.0"
description = "Custom cross-platform control software for Canon EOS R50 V (Wi-Fi, USB, Bluetooth, video)"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "bleak>=0.22",
  "opencv-python>=4.9",
  "PySide6>=6.7",
  "sounddevice>=0.4",  # external mics (DJI Mic, Kreo Sonik) on the computer
  "soundfile>=0.12",
  "pedalboard>=0.9",   # voice chain: low-cut, gate, EQ, compressor, limiter, VST3 plugins
  "noisereduce>=3.0",  # Audacity-style noise-profile reduction for saved recordings
]

[project.optional-dependencies]
framegen = ["rife-ncnn-vulkan-python", "pillow"]
gphoto = ["gphoto2>=2.5"]   # macOS/Linux USB fallback

[project.scripts]
camctl = "camctl.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# sounddevice sets ndarray.shape internally (deprecated in NumPy 2.5); not our code
filterwarnings = ["ignore::DeprecationWarning:sounddevice"]

[tool.setuptools.packages.find]
include = ["camctl*"]
